claims:
  client-registry:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 5s
  policy-manager:
    base-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 5s
  payment:
    base-url: http://localhost:8083
    connect-timeout: 2s
    read-timeout: 5s
    callback-secret: dev-callback-secret
  death-sla:
    duration: PT4H
    warning-fraction: 0.75
    check-interval: PT1M
  straight-through:
    limit: "10000.00"
  worker:
    poll-interval: PT5S
