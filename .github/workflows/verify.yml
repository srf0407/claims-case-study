name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: claims-processing/pom.xml
      - name: Verify
        working-directory: claims-processing
        run: ./mvnw -B verify

  localstack-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: claims-processing/pom.xml
      - name: Verify with LocalStack
        working-directory: claims-processing
        run: ./mvnw -B -P localstack-it verify
